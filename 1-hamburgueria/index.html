<title>Burguer Master | Hambúrguer artesanal</title>
<meta name="description" content="O melhor hambúrguer artesanal da cidade. Peça pelo WhatsApp.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* ===== 1. TOKENS ===== */
:root{
  --bg:#14100e;        /* carvão */
  --surface:#211a17;   /* cards */
  --line:#3a2e29;
  --text:#f6ede4;
  --muted:#b9a99d;
  --red:#e1251b;       /* ketchup */
  --red-dark:#b81a12;
  --yellow:#ffc21a;    /* cheddar */
  --wa:#25d366;
  --display:"Anton","Impact",sans-serif;
  --body:"DM Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --radius:16px;
}

/* ===== 2. BASE (mobile-first) ===== */
*,*::before,*::after{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth;scroll-padding-top:70px}
body{background:var(--bg);color:var(--text);font:400 1rem/1.6 var(--body);-webkit-font-smoothing:antialiased}
img,svg{max-width:100%;display:block}
a{color:inherit;text-decoration:none}
:focus-visible{outline:3px solid var(--yellow);outline-offset:3px}
